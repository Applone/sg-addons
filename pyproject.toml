[project]
name = "sg-addons-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["mypy==1.19.1", "ruff==0.14.3", "yamllint==1.37.1"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["tools/patches.py"]
