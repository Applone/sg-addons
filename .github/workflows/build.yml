name: Build unsigned IPA

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.deleted != true
    strategy:
      fail-fast: false
      matrix:
        edition: [lite, full]
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      EDITION: ${{ matrix.edition }}
      SOURCE_DIR: /Users/Shared/sg-addons-source
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.13'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/patches.py check --release-tag "$RELEASE_TAG"
      - name: Load application configuration
        env:
          BUILD_CONFIGURATION_JSON: ${{ secrets.BUILD_CONFIGURATION_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ['BUILD_CONFIGURATION_JSON']
          if not raw:
              raise SystemExit('Set the BUILD_CONFIGURATION_JSON repository secret; see README.md')
          config = json.loads(raw)
          for key in ('api_id', 'api_hash', 'bundle_id', 'team_id'):
              if not config.get(key):
                  raise SystemExit(f'BUILD_CONFIGURATION_JSON is missing {key}')
          if os.environ['EDITION'] == 'lite':
              config['bundle_id'] += '.lite'
          raw = json.dumps(config)
          Path(os.environ['RUNNER_TEMP'], 'sg-addons-build.json').write_text(raw)
          PY
      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          BUILDBUDDY_CACHE_URL: ${{ vars.BUILDBUDDY_CACHE_URL || 'grpcs://remote.buildbuddy.io' }}
        run: |
          if [[ -z "$BUILDBUDDY_API_KEY" ]]; then
            echo '::error::Set the BUILDBUDDY_API_KEY repository secret; see README.md'
            exit 1
          fi
          umask 077
          {
            printf 'build --remote_cache=%s\n' "$BUILDBUDDY_CACHE_URL"
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --remote_cache_compression\n'
            printf 'build --bes_backend=%s\n' "$BUILDBUDDY_CACHE_URL"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_results_url=https://app.buildbuddy.io/invocation/\n'
          } > "$RUNNER_TEMP/sg-addons-buildbuddy.bazelrc"
          printf '\nimport %s\n' "$RUNNER_TEMP/sg-addons-buildbuddy.bazelrc" >> "$HOME/.bazelrc"
      - name: Fetch pinned upstream, apply patches and fetch build submodules
        run: python3 tools/patches.py prepare "$SOURCE_DIR" --submodules
      - name: Select upstream Xcode
        run: |
          cd "$SOURCE_DIR"
          xcode_version="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          sudo xcode-select -s "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version
      - name: Verify the XCTest simulator before compiling
        run: |
          simulator=$(xcrun simctl create SGAddonsPreflight 'iPhone 17' com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          xcrun simctl delete "$simulator"
      - name: Run native core regression checks
        if: matrix.edition == 'full'
        run: uv run --frozen bash tools/test-core.sh "$SOURCE_DIR"
      - name: Apply Lite source exclusions
        if: matrix.edition == 'lite'
        run: git -C "$SOURCE_DIR" apply --index --whitespace=error "$GITHUB_WORKSPACE/variants/lite.patch"
      - name: Run Apple integration suite
        run: |
          cd "$SOURCE_DIR"
          suite=Tests/AllTests
          if [[ "$EDITION" == lite ]]; then suite=//Swiftgram/SGSettingsUI:SGSettingsUITests; fi
          python3 build-system/Make/Make.py \
            --bazelUserRoot="$RUNNER_TEMP/bazel-root" \
            test --configurationPath="$RUNNER_TEMP/sg-addons-build.json" \
            --xcodeManagedCodesigning --disableProvisioningProfiles \
            --target="$suite"
      - name: Build device IPA using the upstream build system
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd "$SOURCE_DIR"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$RUNNER_TEMP/bazel-root" \
            build \
            --configurationPath="$RUNNER_TEMP/sg-addons-build.json" \
            --xcodeManagedCodesigning \
            --disableProvisioningProfiles \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/build/artifacts"
      - name: Include source provenance
        run: |
          mv build/artifacts/Swiftgram.ipa "build/artifacts/Swiftgram-$EDITION.ipa"
          mv build/artifacts/Swiftgram.DSYMs.zip "build/artifacts/Swiftgram-$EDITION.DSYMs.zip"
          git -C "$SOURCE_DIR" write-tree > build/artifacts/source-tree.txt
          cp upstream.json patches/series build/artifacts/
          git rev-parse HEAD > build/artifacts/patchset-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: sg-addons-${{ matrix.edition }}-${{ github.run_number }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: sg-addons-*-${{ github.run_number }}
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp artifacts/*/Swiftgram-* artifacts/
          uv run --frozen python tools/altsource.py artifacts "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            artifacts/Swiftgram-*.ipa \
            artifacts/Swiftgram-*.DSYMs.zip artifacts/altsource.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --notes 'Unsigned iOS build. Sign the IPA before installing it on a device.'
